MODEL:
  FULL:
    ENABLED: True
    TEXT_CLIP_PATH: 'ViT-B-16.pt'
    LOSS_WEIGHT: 5.0
  TRAJECTORY:
    ENABLED: True
    ACCELERATION_MIX: 1.0
    GAIN_BOUND: 0.0
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'ViT-B-16.pt'
  TRANSFORMER_TYPE: 'vit_base_clip'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  DIST_TRAIN: False
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']
  PROTOCOL: 'ALL'
  AERIAL_CAMS: [5, 6]

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  SYNC_FRAMES: False
  TIE_AUGMENTATION: False
  TIE_ERASING: True

SOLVER:
  TRAJECTORY_LR: 0.00035
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 60
  BASE_LR: 0.00035
  PRETRAINED_LR: 0.000005
  BIAS_LR_FACTOR: 1
  IMS_PER_BATCH: 64
  WARMUP_ITERS: 100
  WARMUP_METHOD: 'linear'
  WARMUP_LR_FACTOR: 0.01
  LR_MIN_FACTOR: 0.002
  LARGE_FC_LR: False
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  LOSS_TYPE: 'base'
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 1024
  RE_RANKING: False
  WEIGHT: 'transformer_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  METRIC: 'sysu'
  TOP_K_EVAL: 0

OUTPUT_DIR: './outputs/A_trajectory_direct_full'
